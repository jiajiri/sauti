name: Auto-Download Models on Push
on:
  push:
    branches: [ main, android ]

jobs:
  verify-and-cache-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Model Downloader CLI
        run: |
          chmod +x scripts/download_models.sh
          ./scripts/download_models.sh

      - name: Verify Model Assets
        run: |
          test -s android/app/src/main/assets/models/whisper-tiny-sw-q4.bin
          test -s android/app/src/main/assets/models/smollm2-135m-sw-q4.gguf
